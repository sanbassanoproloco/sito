<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Attività - Pro Loco San Bassano APS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 900: '#14532d', 950: '#0a2e1a' }, accent: { 500: '#f59e0b' } },
          fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

  <header class="sticky top-0 z-50 bg-brand-950 text-white shadow-lg border-b border-brand-900">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        <a href="index.html" class="flex items-center gap-3">
          <img src="logo.png" alt="Logo" class="h-12 w-auto bg-white p-1 rounded-lg">
          <span class="font-heading font-extrabold text-xl text-white">Pro Loco <span class="text-amber-400">San Bassano</span></span>
        </a>
        <nav class="hidden md:flex items-center space-x-2">
          <a href="index.html" class="px-3 py-2 rounded-md text-sm font-semibold hover:bg-white/10 text-emerald-100">Home page</a>
          <a href="attivita.html" class="px-3 py-2 rounded-md text-sm font-semibold hover:bg-white/10 text-white bg-white/10">Le attività</a>
          <a href="comunicazioni.html" class="px-3 py-2 rounded-md text-sm font-semibold hover:bg-white/10 text-emerald-100">Comunicazioni</a>
          <a href="direttivo.html" class="px-3 py-2 rounded-md text-sm font-semibold hover:bg-white/10 text-emerald-100">Il Direttivo</a>
          <a href="contattaci.html" class="px-3 py-2 rounded-md text-sm font-semibold hover:bg-white/10 text-emerald-100">Contattaci</a>
          <a href="5x1000.html" class="ml-2 px-4 py-2 rounded-lg text-sm font-bold bg-amber-500 text-brand-950">5X1000</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="flex-grow">
    <div class="bg-brand-950 text-white py-12">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="font-heading text-4xl font-extrabold">Le Attività</h1>
        <p class="text-emerald-200 mt-2">Scopri gli eventi, le manifestazioni e i progetti promossi dalla Pro Loco</p>
      </div>
    </div>

    <div class="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="bg-white rounded-2xl overflow-hidden border border-slate-200 p-6 space-y-4 shadow-sm">
          <div class="flex items-center gap-2 text-sm text-slate-500">
            <i class="fa-regular fa-calendar text-emerald-700"></i> 2 giugno 2026
          </div>
          <h3 class="font-heading text-2xl font-extrabold text-slate-900">Festa della Repubblica</h3>
        </div>
        <div class="bg-white rounded-2xl overflow-hidden border border-slate-200 p-6 space-y-4 shadow-sm">
          <div class="flex items-center gap-2 text-sm text-slate-500">
            <i class="fa-regular fa-calendar text-emerald-700"></i> 18-30 maggio 2026
          </div>
          <h3 class="font-heading text-2xl font-extrabold text-slate-900">II memorial Gilberto Marzaroli</h3>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
